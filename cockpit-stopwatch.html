<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콕핏 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --magma: #ff5a1f;
    --magma-hot: #ffa24a;
    --ink: #07070a;
    --panel: #101015;
    --line: #2a2a33;
    --text: #e9e9f0;
    --dim: #6f7080;
    --purple: #c06bff;
    --green: #2dff7a;
    --red: #ff2d3d;
    --blue: #2f8bff;
    --font: "Orbitron", "Segoe UI", "Malgun Gothic", Consolas, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font-family: var(--font);
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,90,31,.10), transparent 60%),
      repeating-linear-gradient(45deg, #0b0b0e 0 3px, #101014 3px 6px),
      #050507;
    display: flex; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden;
  }

  /* 대시보드 하우징 */
  .dash { width: 100%; max-width: 1100px; perspective: 1400px; }
  .visor {
    background: linear-gradient(180deg, #17171d, #0a0a0d);
    border: 2px solid #23232b; border-radius: 48px 48px 90px 90px / 38px 38px 110px 110px;
    padding: 20px 28px 26px;
    box-shadow: 0 -2px 0 rgba(255,255,255,.05) inset, 0 40px 80px rgba(0,0,0,.8), 0 0 60px rgba(255,90,31,.12);
    transform: rotateX(4deg);
  }

  /* 시프트 라이트 */
  .lights { display: flex; justify-content: center; gap: clamp(3px, .8vw, 9px); margin-bottom: 10px; }
  .led { width: clamp(10px, 2.4vw, 26px); height: clamp(10px, 2.4vw, 26px); border-radius: 50%; background: #1a1a20; border: 1px solid #2a2a33; transition: background .05s, box-shadow .05s; }
  .led.on.g { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .led.on.r { background: var(--red);   box-shadow: 0 0 12px var(--red); }
  .led.on.b { background: var(--blue);  box-shadow: 0 0 14px var(--blue); }
  .lights.flash .led { background: var(--blue); box-shadow: 0 0 16px var(--blue); }

  /* 계기 */
  .cluster { display: grid; grid-template-columns: 1fr 1.55fr 1fr; gap: 8px; align-items: center; }
  .cluster svg { width: 100%; height: auto; display: block; overflow: visible; }
  .side { opacity: .96; }
  .tt { font-family: var(--font); fill: var(--text); text-anchor: middle; }
  .dim { fill: var(--dim); }
  .tick { stroke: #5b5c6b; }
  .tick.major { stroke: #d8d8e2; }
  .tick.red { stroke: var(--red); }
  .lbl { font: 700 15px var(--font); fill: #b7b8c6; text-anchor: middle; dominant-baseline: middle; }
  .lbl.red { fill: var(--red); }
  .track { fill: none; stroke: #1f1f27; stroke-width: 6; }
  .redzone { fill: none; stroke: rgba(255,45,61,.55); stroke-width: 6; }
  .prog { fill: none; stroke: url(#magmaGrad); stroke-width: 6; filter: url(#glow); }
  .needle { fill: var(--magma); filter: url(#glow); }

  .gearbox { fill: #0b0b0f; stroke: var(--magma); stroke-width: 2; }

  /* 하단 : 랩 로그 + 버튼 */
  .bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 12px; align-items: stretch; }
  .log { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; min-height: 140px; max-height: 170px; overflow-y: auto; }
  .log h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .25em; color: var(--dim); font-weight: 500; }
  .row { display: grid; grid-template-columns: 56px 1fr 1fr 1fr; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #1c1c23; font-weight: 500; }
  .row.head { color: var(--dim); font-size: 10px; letter-spacing: .15em; }
  .row.best { color: var(--purple); }
  .row span:nth-child(n+2) { text-align: right; }
  .empty { color: var(--dim); font-size: 12px; padding: 18px 0; text-align: center; }

  .controls { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2.5vw, 22px); }
  .btn {
    font-family: var(--font); font-weight: 700; color: var(--text); cursor: pointer; border-radius: 50%;
    border: 3px solid #30303a; background: radial-gradient(circle at 35% 30%, #2a2a33, #0e0e12);
    box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .08s, box-shadow .2s, border-color .2s;
  }
  .btn:active { transform: scale(.93); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn small { display: block; font-size: 9px; letter-spacing: .15em; color: var(--dim); font-weight: 500; margin-top: 3px; }
  .btn.main { width: clamp(92px, 16vw, 124px); height: clamp(92px, 16vw, 124px); font-size: 16px; border-color: var(--green); box-shadow: 0 0 22px rgba(45,255,122,.35), 0 6px 14px rgba(0,0,0,.6); }
  .btn.main.running { border-color: var(--red); box-shadow: 0 0 22px rgba(255,45,61,.45), 0 6px 14px rgba(0,0,0,.6); }
  .btn.lap, .btn.reset { width: clamp(68px, 11vw, 84px); height: clamp(68px, 11vw, 84px); font-size: 13px; }
  .btn.lap:not(:disabled) { border-color: var(--blue); }
  .btn.reset:not(:disabled) { border-color: var(--magma); }

  @media (max-width: 760px) {
    .visor { padding: 14px 12px 20px; border-radius: 30px 30px 60px 60px / 24px 24px 70px 70px; transform: none; }
    .cluster { grid-template-columns: 1fr 1fr; }
    .cluster .center { grid-column: 1 / -1; order: -1; }
    .bottom { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="dash">
  <div class="visor">
    <div class="lights" id="lights"></div>

    <div class="cluster">
      <svg class="side" id="gMin" viewBox="0 0 400 400"></svg>
      <svg class="center" id="gMain" viewBox="0 0 400 400"></svg>
      <svg class="side" id="gLap" viewBox="0 0 400 400"></svg>
    </div>

    <div class="bottom">
      <div class="log">
        <h3>LAP TELEMETRY</h3>
        <div id="laps"><div class="empty">랩 기록이 없습니다</div></div>
      </div>
      <div class="controls">
        <button class="btn reset" id="resetBtn" disabled>RESET<small>R</small></button>
        <button class="btn main" id="startBtn">START<small>SPACE</small></button>
        <button class="btn lap" id="lapBtn" disabled>LAP<small>L</small></button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2, '0');

/* ---------- 게이지 생성 ---------- */
const sweep = f => (-135 + 270 * f);
function pt(r, f) { const a = sweep(f) * Math.PI / 180; return [200 + r * Math.sin(a), 200 - r * Math.cos(a)]; }
function arc(r, f0, f1) {
  const [x0, y0] = pt(r, f0), [x1, y1] = pt(r, f1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${(f1 - f0) * 270 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

function buildGauge(svg, cfg) {
  let s = `<defs>
    <linearGradient id="magmaGrad${cfg.id}" gradientUnits="userSpaceOnUse" x1="0" y1="400" x2="400" y2="0">
      <stop offset="0" stop-color="#ff3d00"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
  </defs>`;
  s += `<circle cx="200" cy="200" r="198" fill="radial-gradient(#000,#000)" opacity="0"/>`;
  s += `<circle cx="200" cy="200" r="168" fill="#08080b" stroke="#1e1e26" stroke-width="2"/>`;
  s += `<path class="track" d="${arc(186, 0, 1)}"/>`;
  s += `<path class="redzone" d="${arc(186, cfg.red, 1)}"/>`;
  s += `<path class="prog" pathLength="100" stroke="url(#magmaGrad${cfg.id})" stroke-dasharray="0 100" d="${arc(186, 0, 1)}"/>`;
  const n = cfg.total / cfg.minor;
  for (let i = 0; i <= n; i++) {
    const v = i * cfg.minor, f = v / cfg.total;
    const major = v % cfg.major === 0, red = f >= cfg.red;
    const [x0, y0] = pt(major ? 148 : 158, f), [x1, y1] = pt(170, f);
    s += `<line class="tick${major ? ' major' : ''}${red ? ' red' : ''}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke-width="${major ? 3 : 1.5}"/>`;
    if (major && v < cfg.total) {
      const [lx, ly] = pt(128, f);
      s += `<text class="lbl${red ? ' red' : ''}" x="${lx}" y="${ly}" style="font-size:${cfg.lbl}px">${v}</text>`;
    }
  }
  s += `<polygon class="needle" points="196,60 204,60 200,26"/>`;
  s += cfg.center;
  svg.innerHTML = s;
  return { needle: svg.querySelector('.needle'), prog: svg.querySelector('.prog') };
}

const gMain = buildGauge($('gMain'), {
  id: 'M', total: 60, major: 5, minor: 1, red: 50 / 60, lbl: 15,
  center: `
    <text class="tt dim" x="200" y="150" style="font-size:11px;letter-spacing:4px">CHRONO</text>
    <text class="tt" id="tMain" x="200" y="214" style="font-size:62px;font-weight:900">00:00</text>
    <text class="tt" id="tCs" x="200" y="256" style="font-size:34px;font-weight:700;fill:#ff8a4a">.00</text>
    <path d="M140 290 H260 L275 330 H125 Z" class="gearbox"/>
    <text class="tt dim" x="200" y="305" style="font-size:9px;letter-spacing:3px">LAP</text>
    <text class="tt" id="tGear" x="200" y="324" style="font-size:22px;font-weight:900;fill:#ff5a1f">0</text>
    <text class="tt dim" id="tState" x="200" y="352" style="font-size:10px;letter-spacing:4px">READY</text>`
});
const gMin = buildGauge($('gMin'), {
  id: 'N', total: 60, major: 10, minor: 2, red: 1.1, lbl: 17,
  center: `
    <text class="tt dim" x="200" y="165" style="font-size:12px;letter-spacing:4px">MIN</text>
    <text class="tt" id="tMin" x="200" y="230" style="font-size:64px;font-weight:900">00</text>
    <text class="tt dim" x="200" y="270" style="font-size:11px;letter-spacing:3px">ELAPSED</text>`
});
const gLap = buildGauge($('gLap'), {
  id: 'L', total: 60, major: 10, minor: 2, red: 1.1, lbl: 17,
  center: `
    <text class="tt dim" x="200" y="165" style="font-size:12px;letter-spacing:4px">LAP TIME</text>
    <text class="tt" id="tLap" x="200" y="222" style="font-size:36px;font-weight:700">00:00.00</text>
    <text class="tt dim" x="200" y="262" style="font-size:11px;letter-spacing:3px">BEST</text>
    <text class="tt" id="tBest" x="200" y="290" style="font-size:20px;font-weight:700;fill:#c06bff">--:--.--</text>`
});

/* ---------- 시프트 라이트 ---------- */
const lightsEl = $('lights');
const LED_N = 15;
for (let i = 0; i < LED_N; i++) {
  const d = document.createElement('div');
  d.className = 'led ' + (i < 5 ? 'g' : i < 10 ? 'r' : 'b');
  lightsEl.appendChild(d);
}
const leds = [...lightsEl.children];

/* ---------- 상태 ---------- */
let running = false, startTime = 0, elapsed = 0, raf = 0, testRaf = 0;
let laps = [], lastLapTotal = 0, bestSplit = Infinity;

function fmt(ms) {
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000);
  return `${p2(m % 100)}:${p2(s)}.${p2(cs)}`;
}
function setGauge(g, f) {
  f = Math.max(0, Math.min(1, f));
  g.needle.setAttribute('transform', `rotate(${sweep(f)} 200 200)`);
  g.prog.setAttribute('stroke-dasharray', `${(f * 100).toFixed(2)} 100`);
}
function setLights(f) {
  const on = Math.floor(f * (LED_N + 1));
  leds.forEach((l, i) => l.classList.toggle('on', i < on));
}

function render() {
  const sec = (elapsed / 1000) % 60;
  const fMain = sec / 60;
  const lapMs = elapsed - lastLapTotal;
  setGauge(gMain, fMain);
  setGauge(gMin, (elapsed / 3600000) % 1);
  setGauge(gLap, ((lapMs / 1000) % 60) / 60);
  setLights(fMain);

  const t = fmt(elapsed);
  $('tMain').textContent = t.slice(0, 5);
  $('tCs').textContent = t.slice(5);
  $('tMin').textContent = p2(Math.floor(elapsed / 60000) % 100);
  $('tLap').textContent = fmt(lapMs);
}

function tick() {
  elapsed = performance.now() - startTime;
  render();
  raf = requestAnimationFrame(tick);
}

function setState(txt) { $('tState').textContent = txt; }

function toggle() {
  cancelAnimationFrame(testRaf);
  if (running) {
    cancelAnimationFrame(raf);
    running = false;
    $('startBtn').firstChild.textContent = 'RESUME';
    $('startBtn').classList.remove('running');
    setState('PAUSED');
    render();
  } else {
    startTime = performance.now() - elapsed;
    raf = requestAnimationFrame(tick);
    running = true;
    $('startBtn').firstChild.textContent = 'STOP';
    $('startBtn').classList.add('running');
    setState('RUNNING');
  }
  $('lapBtn').disabled = !running;
  $('resetBtn').disabled = false;
}

function lap() {
  if (!running) return;
  const split = elapsed - lastLapTotal;
  laps.push({ split, total: elapsed });
  lastLapTotal = elapsed;
  if (split < bestSplit) bestSplit = split;
  $('tGear').textContent = laps.length;
  $('tBest').textContent = fmt(bestSplit);
  renderLaps();
  lightsEl.classList.add('flash');
  setTimeout(() => lightsEl.classList.remove('flash'), 350);
}

function renderLaps() {
  const rows = laps.map((l, i) => {
    const isBest = l.split === bestSplit && laps.length > 1;
    const d = l.split - bestSplit;
    const delta = d === 0 ? '—' : '+' + (d / 1000).toFixed(2);
    return `<div class="row${isBest ? ' best' : ''}"><span>L${p2(i + 1)}</span><span>${fmt(l.split)}</span><span>${delta}</span><span>${fmt(l.total)}</span></div>`;
  }).reverse().join('');
  $('laps').innerHTML = `<div class="row head"><span>LAP</span><span>TIME</span><span>Δ BEST</span><span>TOTAL</span></div>` + rows;
}

function reset() {
  cancelAnimationFrame(raf); cancelAnimationFrame(testRaf);
  running = false; elapsed = 0; laps = []; lastLapTotal = 0; bestSplit = Infinity;
  $('startBtn').firstChild.textContent = 'START';
  $('startBtn').classList.remove('running');
  $('lapBtn').disabled = true; $('resetBtn').disabled = true;
  $('tGear').textContent = '0';
  $('tBest').textContent = '--:--.--';
  $('laps').innerHTML = '<div class="empty">랩 기록이 없습니다</div>';
  setState('READY');
  render();
}

/* ---------- 시동 시 바늘 스윕 연출 ---------- */
function selfTest() {
  const t0 = performance.now(), D = 1600;
  (function step(now) {
    const k = Math.min(1, (now - t0) / D);
    const f = Math.sin(k * Math.PI);
    setGauge(gMain, f); setGauge(gMin, f); setGauge(gLap, f); setLights(f);
    if (k < 1) testRaf = requestAnimationFrame(step); else render();
  })(t0);
}

/* ---------- 이벤트 ---------- */
$('startBtn').onclick = e => { toggle(); e.currentTarget.blur(); };
$('lapBtn').onclick = e => { lap(); e.currentTarget.blur(); };
$('resetBtn').onclick = e => { reset(); e.currentTarget.blur(); };
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key.toLowerCase() === 'l') lap();
  else if (e.key.toLowerCase() === 'r') reset();
});

render();
selfTest();
</script>
</body>
</html>
